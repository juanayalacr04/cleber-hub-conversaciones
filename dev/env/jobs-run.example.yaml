# hub-jobs-run: Jobs programados (Cloud Scheduler)
# Copia este archivo a jobs-run.yaml (queda fuera de git) y llena los <...>. deploy.ps1 lo usa solo.
# OJO: --env-vars-file REEMPLAZA todas las variables de la función: este archivo debe tener el conjunto completo.

# Base con nombre del hub; sin esto todo cae en (default)
FIRESTORE_DATABASE: 'dev-hub-conversaciones'
# Proyecto de desarrollo
GOOGLE_CLOUD_PROJECT: 'ambiente-desarrollo-ti'
# SECRETO; X-Cron-Secret de cada Cloud Scheduler
CRON_SECRET: '<secreto>'
# Para el job de resúmenes
BOT_FUNCTION_URL: '<URL base de la función bot, sin ruta>'
# SECRETO
BOT_FUNCTION_SECRET: '<el mismo secreto de la función bot>'
# Salesforce: URL de la instancia
SF_INSTANCE_URL: 'https://<tu-instancia>.my.salesforce.com'
# Salesforce: app conectada
SF_CLIENT_ID: '<client id>'
# SECRETO
SF_CLIENT_SECRET: '<client secret>'
SF_USERNAME: '<usuario de integración>'
# SECRETO
SF_PASSWORD: '<contraseña + token>'
# Si Ventas y Servicio usan usuarios distintos, agrega SF_VENTAS_USERNAME / SF_SERVICIO_USERNAME (y _PASSWORD, _CLIENT_ID, ...): el de la vertical gana.

# --- Opcionales (descomenta lo que uses) ---
# Opcional: callback de estado al enviar plantillas de campaña
# TWILIO_STATUS_CALLBACK_URL: '<url pública de la función que recibe los estados de Twilio>'
