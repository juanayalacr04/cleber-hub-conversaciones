# hub-close-by-phone: Outbound Message de Salesforce que cierra conversaciones por teléfono
# Copia este archivo a close-by-phone.yaml (queda fuera de git) y llena los <...>. deploy.ps1 lo usa solo.
# OJO: --env-vars-file REEMPLAZA todas las variables de la función: este archivo debe tener el conjunto completo.

# Base con nombre del hub; sin esto todo cae en (default)
FIRESTORE_DATABASE: 'dev-hub-conversaciones'
# Proyecto de desarrollo
GOOGLE_CLOUD_PROJECT: 'ambiente-desarrollo-ti'
# SECRETO; va en ?secret= de la URL que Salesforce llama
EXTERNAL_API_SECRET: '<secreto>'
